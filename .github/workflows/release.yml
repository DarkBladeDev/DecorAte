name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0). Leave empty to use v<version from build.gradle.kts>"
        required: false
        type: string
      create_tag:
        description: "Create and push the tag on this commit if it does not exist yet"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the draft release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve and validate version/tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CREATE_TAG: ${{ inputs.create_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TAG_EXISTS="true"
          else
            if [[ -n "${INPUT_TAG}" ]]; then
              TAG="${INPUT_TAG}"
              if [[ "${TAG}" =~ ^[0-9] ]]; then
                TAG="v${TAG}"
              fi
            else
              BASE_VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | tr -d '\r')"
              if [[ -z "${BASE_VERSION}" || "${BASE_VERSION}" == "unspecified" ]]; then
                echo "::error::Could not resolve project version from Gradle."
                exit 1
              fi
              TAG="v${BASE_VERSION}"
            fi

            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              TAG_EXISTS="true"
              echo "Tag '${TAG}' already exists; checking out tag commit."
              git checkout --detach "refs/tags/${TAG}"
            else
              TAG_EXISTS="false"
              if [[ "${CREATE_TAG}" != "true" ]]; then
                echo "::error::Tag '${TAG}' does not exist and create_tag is false."
                exit 1
              fi
            fi
          fi

          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '${TAG}' must follow SemVer format 'vX.Y.Z' or 'vX.Y.Z-prerelease'."
            exit 1
          fi
          TAG_VERSION="${BASH_REMATCH[1]}"

          GRADLE_VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | tr -d '\r')"
          if [[ -z "${GRADLE_VERSION}" || "${GRADLE_VERSION}" == "unspecified" ]]; then
            echo "::error::Could not resolve project version from Gradle."
            exit 1
          fi

          if [[ "${TAG_VERSION}" != "${GRADLE_VERSION}" ]]; then
            echo "::error::Version mismatch: tag '${TAG}' expects '${TAG_VERSION}', but build.gradle.kts defines '${GRADLE_VERSION}'."
            exit 1
          fi

          IS_PRERELEASE="false"
          if [[ "${TAG_VERSION}" == *-* || "${INPUT_PRERELEASE}" == "true" ]]; then
            IS_PRERELEASE="true"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${GRADLE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${TAG_EXISTS}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release: tag=${TAG}, version=${GRADLE_VERSION}, tag_exists=${TAG_EXISTS}, prerelease=${IS_PRERELEASE}"

      - name: Build and run tests
        run: ./gradlew clean build --no-daemon

      - name: Stage release artifacts and checksum
        id: stage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          JAR_NAME="DecorAte-${VERSION}.jar"
          JAR_PATH="decorate-paper/build/libs/${JAR_NAME}"

          if [[ ! -f "${JAR_PATH}" ]]; then
            echo "::error::Expected shaded plugin JAR not found at '${JAR_PATH}'."
            exit 1
          fi

          mkdir -p dist
          cp "${JAR_PATH}" "dist/${JAR_NAME}"
          (
            cd dist
            sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256"
            cat "${JAR_NAME}.sha256"
          )

          echo "jar_name=${JAR_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DecorAte-${{ steps.meta.outputs.version }}
          path: |
            dist/${{ steps.stage.outputs.jar_name }}
            dist/${{ steps.stage.outputs.jar_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create and push git tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DecorAte ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.stage.outputs.jar_name }}
            dist/${{ steps.stage.outputs.jar_name }}.sha256
